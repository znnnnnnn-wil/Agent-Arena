name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: agent_arena_ci
          MYSQL_USER: agent_arena
          MYSQL_PASSWORD: agent-arena-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_arena_ci?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: agent_arena
      MYSQL_PASSWORD: agent-arena-ci-password
      API_KEY_ENCRYPTION_SECRET: agent-arena-ci-encryption-secret-32bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify backend and MySQL migrations
        run: mvn --batch-mode verify
      - name: Check browser JavaScript syntax
        run: node --check src/main/resources/static/app.js
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright functional journeys
        run: npm run test:e2e:functional
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
