spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.zn.agentarena: info

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent-arena:
  security:
    api-key-encryption-secret: ${API_KEY_ENCRYPTION_SECRET}
